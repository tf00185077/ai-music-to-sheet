[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-music-to-sheet"
version = "0.1.0"
description = "First-MVP CLI for clean single-melody MP3/MP4 to MusicXML conversion."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "AI Music To Sheet" }]

[tool.setuptools.packages.find]
include = ["ai_music_to_sheet*"]
